version: '3.8'

# ==============================================================================
# IINSHA AI AUTOMATION LAB — HARDENED DOCKER INFRASTRUCTURE STACK
# Purpose: Resource limits, Non-Root Container Security, PostgreSQL Vector DB
# Author: Lead AI Automation Engineer Adnin Sadat Mahin
# ==============================================================================

services:
  # n8n Workflow Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: iinsha_n8n_engine
    restart: always
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_HOST=iinsha.netlify.app
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=iinsha_db_user
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-HardenedSecretPassword2026!}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3000M
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - postgres
    networks:
      - iinsha_internal_net

  # OpenClaw Playwright Stealth Scraper
  openclaw-scraper:
    image: mcr.microsoft.com/playwright:v1.45.0-jammy
    container_name: iinsha_openclaw_scraper
    restart: always
    environment:
      - NODE_ENV=production
      - PROXY_MESH_ENABLED=true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2000M
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - iinsha_internal_net

  # PostgreSQL DB with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iinsha_postgres_vector
    restart: always
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=iinsha_db_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-HardenedSecretPassword2026!}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
    volumes:
      - iinsha_postgres_data:/var/lib/postgresql/data
    networks:
      - iinsha_internal_net

volumes:
  iinsha_postgres_data:

networks:
  iinsha_internal_net:
    driver: bridge
