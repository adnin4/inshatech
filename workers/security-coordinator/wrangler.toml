name = "iinsha-security-coordinator"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

[durable_objects]
bindings = [
  { name = "SECURITY_COORDINATOR", class_name = "SecurityCoordinator" }
]

[[migrations]]
tag = "v1-sqlite-security-coordinator"
new_sqlite_classes = ["SecurityCoordinator"]

[env.staging]
name = "iinsha-security-coordinator-staging"
workers_dev = false
[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.durable_objects]
bindings = [
  { name = "SECURITY_COORDINATOR", class_name = "SecurityCoordinator" }
]

[env.production]
name = "iinsha-security-coordinator-production"
workers_dev = false
[env.production.vars]
ENVIRONMENT = "production"

[env.production.durable_objects]
bindings = [
  { name = "SECURITY_COORDINATOR", class_name = "SecurityCoordinator" }
]
