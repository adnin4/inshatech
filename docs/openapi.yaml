openapi: 3.0.3
info:
  title: IINSHA AI-BOS Enterprise API Contract
  version: 2.0.0
  description: Official OpenAPI 3.0 specification for IINSHA Autonomous Business Operating System (Cloudflare Pages Functions + Supabase Backend)
paths:
  /api/services:
    get:
      summary: Retrieve canonical services catalog
      responses:
        '200':
          description: List of active services
    post:
      summary: Create or update service item (Admin Only)
      responses:
        '201':
          description: Service created/updated
  /api/ai/chat:
    post:
      summary: Stateful AI Copilot 2.0 multi-turn conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 2000
                conversation_id:
                  type: string
                mode:
                  type: string
                  enum: [general, sales, architect, support, affiliate, marketing]
      responses:
        '200':
          description: Intelligent conversational response
  /api/tools/execute:
    post:
      summary: Sandboxed 5-Level Tool Execution Gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_name]
              properties:
                tool_name:
                  type: string
                arguments:
                  type: object
                permission_level:
                  type: string
      responses:
        '200':
          description: Tool execution result or approval escalation
  /api/payments/checkout:
    post:
      summary: Provider-Agnostic Checkout Gateway (bKash/Nagad/Stripe/Bank)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, amount, customer_name]
      responses:
        '200':
          description: Order created with payment instructions
  /api/payments/webhook:
    post:
      summary: Server-side payment webhook handler
      responses:
        '200':
          description: Webhook acknowledged & processed
  /api/affiliate/track:
    post:
      summary: 30-day cookie referral click tracker
      responses:
        '200':
          description: Click logged and attribution cookie set
  /api/affiliate/convert:
    post:
      summary: Record conversion and calculate tiered commission
      responses:
        '200':
          description: Conversion logged with idempotency guard
  /api/knowledge/search:
    get:
      summary: RAG Knowledge base retrieval
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Top matching verified knowledge chunks
