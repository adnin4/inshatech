name: Deploy Staging Activation

on:
  push:
    branches:
      - "staging/activation-v1"
      - "staging/activation-v1-fix2"
  pull_request:
    branches:
      - "staging/activation-v1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  ENVIRONMENT: "staging"
  API_VERSION: "v1"

concurrency:
  group: "cloudflare-staging-${{ github.event.pull_request.number || github.ref_name }}"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Syntax / lifecycle regression
        run: npm test

      - name: Generate staging build metadata
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/generate-build-info.mjs

  deploy-preview:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve isolated staging URL
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="${PR_HEAD_REF:-$PUSH_REF_NAME}"
          if [ -z "$ref" ]; then
            echo "Unable to resolve staging ref"
            exit 1
          fi
          slug="${ref//\//-}"
          url="https://${slug}.inshatech.pages.dev"
          echo "STAGING_REF=$ref" >> "$GITHUB_ENV"
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
          echo "Resolved staging ref: $ref"
          echo "Resolved staging URL: $url"

      - name: Deploy Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=inshatech --branch=${{ env.STAGING_REF }}

      - name: Wait for staging URL
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$STAGING_URL/") || code=000
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "Staging reachable: HTTP $code"
              exit 0
            fi
            echo "Staging not ready yet (HTTP $code), attempt $attempt/24"
            sleep 5
          done
          echo "Staging did not become reachable: $STAGING_URL"
          exit 1

      - name: Verify staging health
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$STAGING_URL/api/sre/health" >/tmp/health.json
          cat /tmp/health.json

      - name: Verify staging build SHA
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const https = require('https');
          const base = process.env.STAGING_URL.replace(/\/$/, '');
          const expected = process.env.EXPECTED_SHA;
          https.get(`${base}/api/version`, { timeout: 20000, headers: { 'user-agent': 'IINSHA-staging-verify/1.0' } }, (res) => {
            let body = '';
            res.on('data', (c) => { body += c; });
            res.on('end', () => {
              if (res.statusCode !== 200) {
                console.error(`Version endpoint returned HTTP ${res.statusCode}`);
                process.exit(1);
              }
              let parsed;
              try { parsed = JSON.parse(body); } catch (e) {
                console.error('Version endpoint did not return JSON');
                process.exit(1);
              }
              const actual = parsed.git_sha || parsed.commit_sha || parsed.sha;
              console.log(JSON.stringify({ expected, actual }, null, 2));
              if (actual !== expected) {
                console.error('STAGING SHA PARITY FAIL');
                process.exit(1);
              }
              console.log('STAGING SHA PARITY PASS');
            });
          }).on('error', (err) => { console.error(err); process.exit(1); });
          NODE

      - name: Install Playwright
        run: npm install --no-save playwright@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke against staging
        env:
          LIVE_URL: ${{ env.STAGING_URL }}
        run: npx playwright test scratch/live-browser-smoke.spec.mjs --reporter=line

      - name: Live surface smoke against staging
        env:
          LIVE_URL: ${{ env.STAGING_URL }}
        run: node scripts/live-surface-smoke.mjs
