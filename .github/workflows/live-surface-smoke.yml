name: Staging Surface Smoke (Manual)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Staging/preview URL to verify"
        required: true
        default: "https://staging-activation-v1.inshatech.pages.dev"
        type: string

permissions:
  contents: read

jobs:
  live-surface-smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ inputs.target_url }}
      NODE_VERSION: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run staging surface smoke test
        run: node scripts/live-surface-smoke.mjs
