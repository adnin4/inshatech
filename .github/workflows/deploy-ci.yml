name: Enterprise Staging & Production Verification Pipeline

on:
  push:
    branches: [main, master, staging/activation-v1, staging/activation-v1-fix2, 'staging/**', 'activation/**']
  pull_request:
    branches: [main, master, staging/activation-v1, 'staging/**', 'activation/**']
  workflow_dispatch:

jobs:
  security-audit:
    name: Zero-Trust Security & Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Hardcoded Secrets (TruffleHog - Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Scan for Hardcoded Secrets (TruffleHog - Push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before != ''
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Master Regression Firewall & Security Certification
        run: npm test

      - name: Master Authoritative E2E & Persona Verification
        run: npm run e2e

      - name: Execute PR #7 Ordered Staging Preview & Parity Gate
        run: node scripts/verify-preview-deployment.mjs
        env:
          LIVE_URL: https://inshatech.pages.dev
          EXPECTED_SHA: ${{ github.sha }}
