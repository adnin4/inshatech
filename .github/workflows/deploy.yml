name: Production Quality & Cloudflare Release Authority CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  audit:
    name: Full Spectrum CI & Certification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify JavaScript Code Base Integrity
        run: |
          node -c app.js
          node -c hero3d.js
          node -c scroll-engine.js
          node -c worker.js
          node -c universal_ai_copilot.js
          node scripts/check_functions_imports.mjs

      - name: Gate 0 — UI/UX Visual Baseline Firewall
        run: node scripts/visual_regression_baseline.mjs

      - name: Step 7 — Form Contract Root-Cause Repair Audit
        run: node scripts/form_contract_audit.mjs

      - name: Step 8 — AI Solution Finder E2E Certification
        run: node scripts/solution_finder_e2e.mjs

      - name: Step 9 — Universal AI Copilot E2E Certification
        run: node scripts/copilot_e2e.mjs

      - name: Step 10 — Agentic Workforce Reliability Certification
        run: node scripts/agentic_workforce_reliability.mjs

      - name: Step 11 — Production Browser & UI/UX Regression Certification
        run: node scripts/production_browser_certification.mjs

      - name: Step 12 — Agentic Business Control Tower Certification
        run: node scripts/business_control_tower_certification.mjs

      - name: Step 13 — Production SLO, Cost Guardrails & DR Certification
        run: node scripts/production_slo_dr_certification.mjs

      - name: Step 14 — Agent Governance, Evaluation & Promotion Certification
        run: node scripts/agent_governance_eval_certification.mjs

      - name: Step 15 — Production Pilot & Preflight Release Certification
        run: node scripts/production_pilot_certification.mjs

      - name: Step 16 — Autonomous Revenue & Customer Success Loop Certification
        run: node scripts/revenue_success_loop_certification.mjs

      - name: Step 17 — Unified Multimodal AI Experience Layer Certification
        run: node scripts/unified_ai_experience_certification.mjs

      - name: Step 18 — Autonomous Workflow Kernel & Evidence Graph Certification
        run: node scripts/autonomous_kernel_certification.mjs

      - name: Step 19 — Agent Quality, Evaluation & Distributed Observability Certification
        run: node scripts/agent_quality_observability_certification.mjs

      - name: Step 20 — Production Chaos, Load & Data Integrity Certification
        run: node scripts/chaos_resilience_certification.mjs

      - name: Step 21 — Golden E2E Master Closed-Loop Certification
        run: node scripts/golden_e2e_master_certification.mjs

      - name: Step 22 — Master Full-Spectrum Runtime Execution Probe
        run: node scripts/master_full_spectrum_executor.mjs

      - name: Step 23 — Ultra-Comprehensive All-Surface Reliability Audit
        run: node scripts/all_surface_reliability_audit.mjs

      - name: Live Surface & Button Parity Scanner
        run: node scripts/live-surface-smoke.mjs

      - name: P0 Security & Content Hardening Gate
        run: node scratch/security_content_gate.js

  runtime-evidence:
    name: Post-Deploy Edge Runtime Evidence Gate
    runs-on: ubuntu-latest
    if: github.repository == 'adnin4/inshatech' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    timeout-minutes: 12
    needs: audit
    permissions:
      contents: read
    steps:
      - name: Wait for Cloudflare edge deployment
        shell: bash
        run: |
          set -euo pipefail
          base_url="${CLOUDFLARE_PAGES_URL:-https://inshatech-b6b.pages.dev}"
          url="${base_url}/api/version"
          expected='${{ github.sha }}'
          echo "Waiting for runtime ($url) to serve target release: $expected"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 10 "$url" 2>/dev/null); then
              printf '%s' "$body" > /tmp/version.json
              actual=$(jq -r '.deploy_sha // .release_identity.shas.deployment_sha // empty' /tmp/version.json 2>/dev/null || true)
              if [ -n "$actual" ] && [ "${actual,,}" = "${expected,,}" ]; then
                echo "Target deployment SHA active on Cloudflare edge: $actual"
                exit 0
              fi
              echo "Attempt $attempt/60: edge running '$actual', waiting for '$expected'..."
            else
              echo "Attempt $attempt/60: runtime endpoint not reachable yet..."
            fi
            sleep 10
          done
          echo "Timeout: Cloudflare Pages did not deploy $expected within 10 minutes."
          exit 1

      - name: Verify edge deployment identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.sha }}'
          actual=$(jq -r '.deploy_sha // .release_identity.shas.deployment_sha // empty' /tmp/version.json)
          status=$(jq -r '.status // empty' /tmp/version.json)
          branch=$(jq -r '.branch // .release_identity.branch.active // empty' /tmp/version.json)
          repo=$(jq -r '.canonical_repository // empty' /tmp/version.json)
          env_name=$(jq -r '.environment // empty' /tmp/version.json)
          db_verified=$(jq -r '.database_identity.verified // .database_identity.db_parity // false' /tmp/version.json)
          db_status=$(jq -r '.database_identity.status // empty' /tmp/version.json)

          test -n "$actual" || { echo 'Missing deploy_sha'; exit 1; }
          test "${actual,,}" = "${expected,,}" || {
            echo "Deployment SHA mismatch: expected $expected, got $actual"
            exit 1
          }
          test "$branch" = 'master' || test "$branch" = 'main' || { echo "Unexpected branch: $branch"; exit 1; }
          test "$repo" = 'https://github.com/adnin4/inshatech.git' || { echo "Unexpected canonical repository: $repo"; exit 1; }

          echo "Deployment SHA and Repository Parity Verified: $actual on branch $branch (Environment: $env_name)"
          echo "Database Parity Status: $db_status"

          if [ "$env_name" = "production" ]; then
            test "$db_verified" = 'true' || { echo "Production database identity is not verified: status=$db_status"; exit 1; }
            test "$status" = 'LIVE_VERIFIED' || { echo "Production release status is $status; expected LIVE_VERIFIED"; exit 1; }
          else
            echo "Staging edge verification complete. Status: $status"
          fi

      - name: Verify edge health endpoint
        shell: bash
        run: |
          set -euo pipefail
          base_url="${CLOUDFLARE_PAGES_URL:-https://inshatech-b6b.pages.dev}"
          body=$(curl -fsSL --max-time 15 "${base_url}/api/health")
          echo "$body"
          status=$(printf '%s' "$body" | jq -r '.status // empty')
          test "$status" = 'EDGE_HEALTHY' || test "$status" = 'EDGE_AND_DB_HEALTHY' || { echo "Unexpected health status: $status"; exit 1; }

      - name: Verify edge SRE endpoint
        shell: bash
        run: |
          set -euo pipefail
          base_url="${CLOUDFLARE_PAGES_URL:-https://inshatech-b6b.pages.dev}"
          body=$(curl -fsSL --max-time 15 "${base_url}/api/sre/health")
          echo "$body"
          status=$(printf '%s' "$body" | jq -r '.status // empty')
          git_sha=$(printf '%s' "$body" | jq -r '.git_sha // empty')
          env_name=$(jq -r '.environment // "staging"' /tmp/version.json 2>/dev/null || echo "staging")
          if [ "$env_name" = "production" ]; then
            test "$status" = 'SRE_HEALTHY' || { echo "Unexpected production SRE status: $status"; exit 1; }
          else
            test "$status" = 'SRE_HEALTHY' || test "$status" = 'DEPENDENCY_UNAVAILABLE' || { echo "Unexpected staging SRE status: $status"; exit 1; }
          fi
          test "${git_sha,,}" = "${{ github.sha }}" || test -z "$git_sha" || { echo "SRE SHA mismatch: $git_sha"; exit 1; }

      - name: Emit deployment evidence summary
        shell: bash
        run: |
          set -euo pipefail
          base_url="${CLOUDFLARE_PAGES_URL:-https://inshatech-b6b.pages.dev}"
          env_name=$(jq -r '.environment // "staging"' /tmp/version.json)
          if [ "$env_name" = "production" ]; then
            evidence_label="PRODUCTION_RUNTIME_EVIDENCE=PASS"
          else
            evidence_label="STAGING_RUNTIME_EVIDENCE=PASS"
          fi
          cat <<EOF
          ${evidence_label}
          RELEASE_SHA=${{ github.sha }}
          DEPLOYMENT_URL=${base_url}
          ENVIRONMENT=${env_name}
          VERSION_STATUS=$(jq -r '.status' /tmp/version.json)
          DB_PARITY=$(jq -r '.database_identity.db_parity' /tmp/version.json)
          EOF
