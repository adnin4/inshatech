name: Production Quality & Cloudflare Pages Deployment CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-deploy:
    name: Master CI Audit & Cloudflare Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Gate 0 — UI/UX Visual Baseline Firewall
        run: node scripts/visual_regression_baseline.mjs

      - name: Step 7 — Form Contract Root-Cause Repair Audit
        run: node scripts/form_contract_audit.mjs

      - name: Step 8 — AI Solution Finder E2E Certification
        run: node scripts/solution_finder_e2e.mjs

      - name: Live Surface & Button Parity Scanner
        run: node scripts/live-surface-smoke.mjs

      - name: Production credential preflight
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is required for production deployment'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is required for production deployment'; exit 1; }

      - name: Deploy to Cloudflare Pages (Automated Production Pipeline)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'inshatech'
          directory: '.'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
