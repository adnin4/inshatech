name: Verify Production Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: "production-release-verification"
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  LIVE_URL: "https://inshatech.pages.dev"
  ENVIRONMENT: "production"
  SCHEMA_VERSION: "2026.8.20"
  API_VERSION: "v1"

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate build metadata
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/generate-build-info.mjs

      - name: Verify no developer-machine paths in deployable source
        shell: bash
        run: |
          set -euo pipefail
          scan_paths=(index.html '*.html' '*.js' '*.css' '*.json' 'functions' 'js' 'api')
          for target in "${scan_paths[@]}"; do
            matches=$(grep -RInE 'C:\\\\Users\\\\|/Users/|/home/[A-Za-z0-9_.-]+/' \
              --exclude-dir=.git --exclude='*.map' --exclude='*.min.js' $target 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "$matches"
              echo 'ERROR: developer-machine absolute path detected in deployable source'
              exit 1
            fi
          done

      - name: Wait for authoritative master CI checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'IINSHA AI-BOS Master Production CI'
            'Zero-Regression & Cloudflare Pages Guard'
            'Final Activation Gates'
            'Autonomous Company Wave 1'
          )

          for attempt in $(seq 1 60); do
            json=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100")
            export CHECKS_JSON="$json"

            gate=$(node <<'NODE'
            const checks = JSON.parse(process.env.CHECKS_JSON).check_runs || [];
            const required = [
              'IINSHA AI-BOS Master Production CI',
              'Zero-Regression & Cloudflare Pages Guard',
              'Final Activation Gates',
              'Autonomous Company Wave 1'
            ];
            let ready = true;
            let failed = false;
            for (const name of required) {
              const matches = checks.filter(c => c.name === name);
              const latest = matches.sort((a,b) => new Date(b.completed_at || b.started_at || 0) - new Date(a.completed_at || a.started_at || 0))[0];
              console.log(`${name}: ${latest ? `${latest.status}/${latest.conclusion}` : 'not yet reported'}`);
              if (!latest || latest.status !== 'completed') ready = false;
              if (latest && latest.status === 'completed' && latest.conclusion !== 'success') failed = true;
            }
            process.stdout.write(`${ready ? 'READY' : 'WAIT'} ${failed ? 'FAILED' : 'OK'}\n`);
            NODE
            )

            echo "Gate summary: $gate (attempt $attempt/60)"
            if echo "$gate" | grep -q 'FAILED'; then
              echo 'AUTHORITATIVE CI GATE FAIL'
              exit 1
            fi
            if echo "$gate" | tail -n 1 | grep -q '^READY OK$'; then
              echo 'AUTHORITATIVE CI GATE PASS'
              exit 0
            fi
            sleep 10
          done

          echo 'AUTHORITATIVE CI GATE TIMEOUT'
          exit 1

  release:
    needs: verify-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy directly when Cloudflare API credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials configured; performing explicit production deployment."
            npx --yes wrangler@4 pages deploy . --project-name=inshatech
          else
            echo "Cloudflare deploy credentials are not configured in GitHub Actions."
            echo "Relying on the connected Cloudflare Pages Git deployment and verifying the live artifact by SHA."
          fi

      - name: Wait for live deployment to expose this SHA
        env:
          LIVE_URL: ${{ env.LIVE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/version.json -w "%{http_code}" --max-time 15 "$LIVE_URL/api/version") || code=000
            if [ "$code" = "200" ]; then
              actual=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/version.json','utf8')); process.stdout.write(p.git_sha||p.commit_sha||p.sha||'')")
              echo "Attempt $attempt/60: expected=$EXPECTED_SHA actual=$actual"
              if [ "$actual" = "$EXPECTED_SHA" ]; then
                echo "LIVE SHA PARITY PASS"
                exit 0
              fi
            else
              echo "Attempt $attempt/60: /api/version HTTP $code"
            fi
            sleep 10
          done
          echo "LIVE SHA PARITY FAIL: production did not expose the current master SHA."
          exit 1

      - name: Run production browser and surface smoke
        env:
          SITE_BASE_URL: ${{ env.LIVE_URL }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/production_site_smoke.mjs
