name: Production Quality & Cloudflare Pages Deployment CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

env:
  NODE_VERSION: '22'
  LIVE_URL: 'https://inshatech.pages.dev'

jobs:
  audit:
    name: Master CI Audit & Production Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Verify JavaScript Code Base Integrity
        run: |
          node --check app.js
          node --check hero3d.js
          node --check scroll-engine.js
          node --check worker.js
          node --check universal_ai_copilot.js

      - name: Gate 0 — UI/UX Visual Baseline Firewall
        run: node scripts/visual_regression_baseline.mjs

      - name: Step 7 — Form Contract Root-Cause Repair Audit
        run: node scripts/form_contract_audit.mjs

      - name: Step 8 — AI Solution Finder E2E Certification
        run: node scripts/solution_finder_e2e.mjs

      - name: Step 9 — Universal AI Copilot E2E Certification
        run: node scripts/copilot_e2e.mjs

      - name: Step 10 — Agentic Workforce Reliability Certification
        run: node scripts/agentic_workforce_reliability.mjs

      - name: Step 11 — Production Browser & UI/UX Regression Certification
        run: node scripts/production_browser_certification.mjs

      - name: Step 12 — Agentic Business Control Tower Certification
        run: node scripts/business_control_tower_certification.mjs

      - name: Step 13 — Production SLO, Cost Guardrails & DR Certification
        run: node scripts/production_slo_dr_certification.mjs

      - name: Step 14 — Agent Governance, Evaluation & Promotion Certification
        run: node scripts/agent_governance_eval_certification.mjs

      - name: Step 15 — Production Pilot & Preflight Release Certification
        run: node scripts/production_pilot_certification.mjs

      - name: Step 16 — Autonomous Revenue & Customer Success Loop Certification
        run: node scripts/revenue_success_loop_certification.mjs

      - name: Step 17 — Unified Multimodal AI Experience Layer Certification
        run: node scripts/unified_ai_experience_certification.mjs

      - name: Step 18 — Autonomous Workflow Kernel & Evidence Graph Certification
        run: node scripts/autonomous_kernel_certification.mjs

      - name: Step 19 — Agent Quality, Evaluation & Distributed Observability Certification
        run: node scripts/agent_quality_observability_certification.mjs

      - name: Step 20 — Production Chaos, Load & Data Integrity Certification
        run: node scripts/chaos_resilience_certification.mjs

      - name: Step 21 — Golden E2E Master Closed-Loop Certification
        run: node scripts/golden_e2e_master_certification.mjs

      - name: Step 22 — Master Full-Spectrum Runtime Execution Probe
        run: node scripts/master_full_spectrum_executor.mjs

      - name: Step 23 — Ultra-Comprehensive All-Surface Reliability Audit
        run: node scripts/all_surface_reliability_audit.mjs

      - name: Live Surface & Button Parity Scanner
        run: node scripts/live-surface-smoke.mjs

  production-release:
    name: Production Release Verification
    needs: audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require Cloudflare deployment authority
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo 'ERROR: production Cloudflare credentials are not configured.'
            echo 'Refusing to report a successful production release without deployment authority.'
            exit 1
          fi

      - name: Deploy exact master SHA to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name=inshatech --branch=master

      - name: Verify live SHA parity
        env:
          LIVE_URL: ${{ env.LIVE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 15 "$LIVE_URL/api/version") || code=000
            if [[ "$code" == '200' ]]; then
              actual=$(node - <<'NODE'
const fs = require('node:fs');
const payload = JSON.parse(fs.readFileSync('/tmp/version.json', 'utf8'));
process.stdout.write(payload.git_sha || payload.commit_sha || payload.sha || '');
NODE
)
              echo "attempt=$attempt expected=$EXPECTED_SHA actual=$actual"
              if [[ "$actual" == "$EXPECTED_SHA" ]]; then
                echo 'LIVE_SHA_PARITY_PASS'
                exit 0
              fi
            else
              echo "attempt=$attempt /api/version http=$code"
            fi
            sleep 10
          done
          echo 'LIVE_SHA_PARITY_FAIL'
          exit 1

      - name: Run production browser certification
        env:
          SITE_BASE_URL: ${{ env.LIVE_URL }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/production_browser_certification.mjs

      - name: Run live surface smoke
        env:
          BASE_URL: ${{ env.LIVE_URL }}
        run: node scripts/live-surface-smoke.mjs
