name: Production Quality & Cloudflare Release Authority CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  audit:
    name: Full Spectrum CI & Certification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify JavaScript Code Base Integrity
        run: |
          node -c app.js
          node -c hero3d.js
          node -c scroll-engine.js
          node -c worker.js
          node -c universal_ai_copilot.js
          node scripts/check_functions_imports.mjs

      - name: Gate 0 — UI/UX Visual Baseline Firewall
        run: node scripts/visual_regression_baseline.mjs

      - name: Step 7 — Form Contract Root-Cause Repair Audit
        run: node scripts/form_contract_audit.mjs

      - name: Step 8 — AI Solution Finder E2E Certification
        run: node scripts/solution_finder_e2e.mjs

      - name: Step 9 — Universal AI Copilot E2E Certification
        run: node scripts/copilot_e2e.mjs

      - name: Step 10 — Agentic Workforce Reliability Certification
        run: node scripts/agentic_workforce_reliability.mjs

      - name: Step 11 — Production Browser & UI/UX Regression Certification
        run: node scripts/production_browser_certification.mjs

      - name: Step 12 — Agentic Business Control Tower Certification
        run: node scripts/business_control_tower_certification.mjs

      - name: Step 13 — Production SLO, Cost Guardrails & DR Certification
        run: node scripts/production_slo_dr_certification.mjs

      - name: Step 14 — Agent Governance, Evaluation & Promotion Certification
        run: node scripts/agent_governance_eval_certification.mjs

      - name: Step 15 — Production Pilot & Preflight Release Certification
        run: node scripts/production_pilot_certification.mjs

      - name: Step 16 — Autonomous Revenue & Customer Success Loop Certification
        run: node scripts/revenue_success_loop_certification.mjs

      - name: Step 17 — Unified Multimodal AI Experience Layer Certification
        run: node scripts/unified_ai_experience_certification.mjs

      - name: Step 18 — Autonomous Workflow Kernel & Evidence Graph Certification
        run: node scripts/autonomous_kernel_certification.mjs

      - name: Step 19 — Agent Quality, Evaluation & Distributed Observability Certification
        run: node scripts/agent_quality_observability_certification.mjs

      - name: Step 20 — Production Chaos, Load & Data Integrity Certification
        run: node scripts/chaos_resilience_certification.mjs

      - name: Step 21 — Golden E2E Master Closed-Loop Certification
        run: node scripts/golden_e2e_master_certification.mjs

      - name: Step 22 — Master Full-Spectrum Runtime Execution Probe
        run: node scripts/master_full_spectrum_executor.mjs

      - name: Step 23 — Ultra-Comprehensive All-Surface Reliability Audit
        run: node scripts/all_surface_reliability_audit.mjs

      - name: Live Surface & Button Parity Scanner
        run: node scripts/live-surface-smoke.mjs

      - name: P0 Security & Content Hardening Gate
        run: node scratch/security_content_gate.js

  production-runtime-evidence:
    name: Post-Deploy Production Runtime Evidence Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 12
    needs: audit
    permissions:
      contents: read
    steps:
      - name: Wait for Cloudflare production deployment
        shell: bash
        run: |
          set -euo pipefail
          url='https://inshatech.pages.dev/api/version'
          echo "Waiting for production runtime: $url"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 10 "$url"); then
              echo "$body"
              printf '%s' "$body" > /tmp/version.json
              if jq -e '.deploy_sha != null' /tmp/version.json >/dev/null 2>&1; then
                exit 0
              fi
            fi
            echo "Attempt $attempt/60: runtime not ready yet"
            sleep 10
          done
          echo 'Production /api/version did not become reachable with a deployment SHA.'
          exit 1

      - name: Verify production deployment identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.sha }}'
          actual=$(jq -r '.deploy_sha // empty' /tmp/version.json)
          status=$(jq -r '.status // empty' /tmp/version.json)
          branch=$(jq -r '.branch // empty' /tmp/version.json)
          repo=$(jq -r '.canonical_repository // empty' /tmp/version.json)
          db_parity=$(jq -r '.database_identity.db_parity // false' /tmp/version.json)

          test -n "$actual" || { echo 'Missing production deploy_sha'; exit 1; }
          test "${actual,,}" = "${expected,,}" || {
            echo "Production SHA mismatch: expected $expected, got $actual"
            exit 1
          }
          test "$branch" = 'master' || { echo "Unexpected production branch: $branch"; exit 1; }
          test "$repo" = 'https://github.com/adnin4/inshatech.git' || { echo "Unexpected canonical repository: $repo"; exit 1; }
          test "$db_parity" = 'true' || { echo 'Production database identity is not verified for parity'; exit 1; }
          test "$status" = 'LIVE_VERIFIED' || { echo "Production release status is $status, not LIVE_VERIFIED"; exit 1; }

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 15 'https://inshatech.pages.dev/api/health')
          echo "$body"
          status=$(printf '%s' "$body" | jq -r '.status // empty')
          test "$status" = 'EDGE_HEALTHY' || { echo "Unexpected health status: $status"; exit 1; }

      - name: Verify production SRE endpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 15 'https://inshatech.pages.dev/api/sre/health')
          echo "$body"
          status=$(printf '%s' "$body" | jq -r '.status // empty')
          git_sha=$(printf '%s' "$body" | jq -r '.git_sha // empty')
          test "$status" = 'SRE_HEALTHY' || { echo "Unexpected SRE status: $status"; exit 1; }
          test "${git_sha,,}" = "${{ github.sha }}" || { echo "SRE SHA mismatch: $git_sha"; exit 1; }

      - name: Emit production evidence summary
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF
          PRODUCTION_RUNTIME_EVIDENCE=PASS
          RELEASE_SHA=${{ github.sha }}
          PRODUCTION_URL=https://inshatech.pages.dev
          VERSION_STATUS=$(jq -r '.status' /tmp/version.json)
          DB_PARITY=$(jq -r '.database_identity.db_parity' /tmp/version.json)
          EOF
