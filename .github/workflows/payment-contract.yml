name: Payment Webhook Security Contract

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  payment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify payment webhook contract
        run: |
          node scripts/payment_webhook_contract.mjs
          node scripts/test_payment_hardening_contract.mjs
