name: Public Site Functionality Gate

on:
  push:
    branches: [site-functionality-recovery]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-site-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded public-app repair
        run: node scripts/repair_public_site_app.mjs

      - name: Persist guarded repair to recovery branch
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo 'No public-app repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix: auto-repair public app syntax'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Repository JavaScript syntax gate
        run: node scripts/javascript_syntax_gate.mjs

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public site E2E
        env:
          SITE_BASE_URL: https://inshatech.pages.dev
        run: node scripts/public_site_e2e.mjs
