name: CI Agent & Experience (Copilot, Solution Finder & Autonomous Workforce)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci-agent:
    name: Solution Finder, Copilot & Multi-Agent Workforce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Interactive Solution Finder & Copilot Harness
        run: |
          node scripts/solution_finder_e2e.mjs
          node scripts/copilot_e2e.mjs
      - name: Agentic Workforce & Business Control Tower
        run: |
          node scripts/agentic_workforce_reliability.mjs
          node scripts/business_control_tower_certification.mjs
          node scripts/agent_governance_eval_certification.mjs
          node scripts/revenue_success_loop_certification.mjs
          node scripts/unified_ai_experience_certification.mjs
          node scripts/autonomous_kernel_certification.mjs
          node scripts/agent_quality_observability_certification.mjs
