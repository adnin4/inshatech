name: IINSHA Final Security Gate
on:
  push:
    branches: [main, master, 'agent/**']
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Edge function syntax
        run: find functions/api -name '*.js' -exec node --check {} +
      - name: Final fail-closed security gate
        run: node scratch/final_security_gate.js
      - name: Build metadata integrity
        run: node -e "const a=require('./build-info.json'),b=require('./version.json'); if(!a.git_sha||a.git_sha!==b.git_commit_sha) process.exit(1); console.log('Metadata SHA parity:',a.git_sha)"
