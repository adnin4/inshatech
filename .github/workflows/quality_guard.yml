name: Zero-Regression & Cloudflare Pages Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Wrangler Pages Specification
        run: |
          python -c "
          import sys
          with open('wrangler.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          errors = []
          if 'main =' in content: errors.append('main = key present')
          if '[assets]' in content: errors.append('[assets] section present')
          if 'pages_build_output_dir = \".\"' not in content: errors.append('output dir is not .')
          if errors:
              print('INVALID WRANGLER CONFIG:', errors)
              sys.exit(1)
          print('Wrangler config valid for Cloudflare Pages!')
          "

      - name: Validate JS DOM Isolation Protocol
        run: |
          python -c "
          import re, sys
          with open('app.js', 'r', encoding='utf-8') as f:
              code = f.read()
          has_body_mount = bool(re.search(r'document\\.body\\.(?:appendChild|append|insertAdjacentHTML)\\s*\\(', code))
          has_modal_root = any(marker in code for marker in ('modal', 'Modal', 'cms-root', 'dialog'))
          if not has_body_mount and not has_modal_root:
              print('ERROR: No modal/container DOM mounting pattern detected in app.js')
              sys.exit(1)
          print('JS DOM Isolation Protocol structural checks passed!')
          "

      - name: Run Business Truth Regression Gates
        run: node scripts/verify_business_truth_gates.mjs
