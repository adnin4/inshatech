name: Staging Browser Smoke (Manual)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Staging/preview URL to verify"
        required: true
        default: "https://staging-activation-v1.inshatech.pages.dev"
        type: string

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ inputs.target_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npm install --no-save playwright@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npx playwright test scratch/live-browser-smoke.spec.mjs --reporter=line
