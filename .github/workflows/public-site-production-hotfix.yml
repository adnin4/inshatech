name: Public Site Production Hotfix
on:
  push:
    branches: [public-site-production-hotfix]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic public-site hotfix
        run: node scripts/apply_public_site_hotfix.mjs
      - name: Fix clean-URL redirect loop
        run: |
          cat > _redirects <<'EOF'
# Clean URL routing is handled by explicit page assets; no .html -> clean rewrite pairs.
EOF
      - name: Commit hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js _redirects
          git commit -m 'fix: repair public-site runtime and clean URLs'
          git push origin HEAD:public-site-production-hotfix
