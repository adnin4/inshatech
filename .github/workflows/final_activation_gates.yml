name: Final Activation Gates

on:
  pull_request:
    branches: [master]
  push:
    branches: [feat/final-activation-gates]

permissions:
  contents: read

jobs:
  lifecycle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax gate
        run: |
          node --check ai_brain/autonomous_company_completion.js
          node --check ai_brain/lead_acquisition_engine.js
          node --check ai_brain/lead_outreach_policy.js
          node --check ai_brain/margin_guardian.js

      - name: Lifecycle regression gate
        run: node --test scratch/autonomous_company_lifecycle_test.mjs scratch/autonomous_company_wave1_test.mjs
