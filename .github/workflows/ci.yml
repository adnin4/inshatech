name: IINSHA AI-BOS Master Production CI

on:
  push:
    branches: [ main, master, gh-pages ]
  pull_request:
    branches: [ main, master ]

jobs:
  production-certification:
    name: Production Verification & Security Audit Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Syntax Check All Edge Functions
        run: |
          echo ">>> Validating JavaScript syntax across all Edge Functions..."
          find functions/api -name "*.js" -exec node --check {} +
          echo ">>> Edge Function syntax validation passed."

      - name: 2. Master 3X Deep Audit (Links, Metadata, Clean URLs)
        run: node scratch/master_deep_audit_3x.js

      - name: 3. Interactive Buttons & Link Integrity Audit (283 Buttons)
        run: node scratch/audit_all_buttons.js

      - name: 4. Comprehensive Master QA Suite (308 Tests)
        run: node scratch/comprehensive_test.js

      - name: 5. 45-Phase Master Architectural Certification
        run: node scratch/master_45_phase_certification.js

      - name: 6. 60-Frontier Runtime Execution Engine (Zero Placeholders)
        run: node scratch/master_60_frontier_verification.js

      - name: 7. 45-Pillar Final Closure Certification
        run: node scratch/final_closure_certification.js

      - name: 8. Automated E2E Production Contract Verification
        run: node scratch/e2e_production_contract.js

      - name: 9. Final Security Gate (Zero Fallback / Strict Credentials)
        run: node scratch/final_security_gate.js

      - name: 10. Multi-Tenant RLS Adversarial Attack Suite
        run: node scratch/rls_tenant_isolation_test.js

      - name: 11. Automated Disaster Recovery Failover Drill
        run: node scratch/disaster_recovery_drill.js

      - name: 12. 52-Sector Master Production Evidence Generation
        run: node scratch/generate_52_sector_evidence_report.js

      - name: 13. Verify Build Info & Deployment Parity Artifacts
        run: |
          echo ">>> Verifying build-info.json and version.json..."
          test -f build-info.json
          test -f version.json
          node -e "const v = require('./build-info.json'); console.log('Current commit build SHA:', v.git_sha);"

      - name: 14. Verify Database Migrations (SQL Files & RLS Policies)
        run: |
          echo ">>> Verifying SQL database migrations..."
          count=$(ls -1 supabase/migrations/*.sql | wc -l)
          echo "Found $count SQL migrations."
          test $count -ge 17
          echo ">>> Production verification gates completed."
