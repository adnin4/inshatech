name: IINSHA AI-BOS Master Production CI

on:
  push:
    branches: [ main, master, gh-pages, staging/activation-v1, staging/activation-v1-fix2, 'staging/**', 'activation/**' ]
  pull_request:
    branches: [ main, master, staging/activation-v1, 'staging/**', 'activation/**' ]
  workflow_dispatch:

jobs:
  production-certification:
    name: Production Verification & Security Audit Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Verify JavaScript Code Base Integrity
        run: |
          node -c app.js
          node -c hero3d.js
          node -c scroll-engine.js
          node -c worker.js
          node -c universal_ai_copilot.js

      - name: Gate 0 - UI/UX Visual Baseline Firewall
        run: node scripts/visual_regression_baseline.mjs

      - name: Step 7 - Form Contract Root-Cause Repair Audit
        run: node scripts/form_contract_audit.mjs

      - name: Step 8 - AI Solution Finder E2E Certification
        run: node scripts/solution_finder_e2e.mjs

      - name: Step 9 - Universal AI Copilot E2E Certification
        run: node scripts/copilot_e2e.mjs

      - name: Step 10 - Agentic Workforce Reliability Certification
        run: node scripts/agentic_workforce_reliability.mjs

      - name: Step 11 - Production Browser & UI/UX Regression Certification
        run: node scripts/production_browser_certification.mjs

      - name: Step 12 - Agentic Business Control Tower Certification
        run: node scripts/business_control_tower_certification.mjs

      - name: Step 13 - Production SLO, Cost Guardrails & DR Certification
        run: node scripts/production_slo_dr_certification.mjs

      - name: Live Surface & Button Parity Scanner
        run: node scripts/live-surface-smoke.mjs
