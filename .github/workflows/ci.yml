name: IINSHA AI-BOS Master Production CI

on:
  push:
    branches: [ main, master, gh-pages ]
  pull_request:
    branches: [ main, master ]

jobs:
  production-certification:
    name: Production Verification & Security Audit Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax Check All Edge Functions
        run: |
          echo ">>> Validating JavaScript syntax across all Edge Functions..."
          find functions/api -name "*.js" -exec node --check {} +
          echo ">>> 100% Edge Function Syntax Validation Passed."

      - name: Run Master 3X Deep Audit (Links, Metadata, APIs)
        run: node scratch/master_deep_audit_3x.js

      - name: Run Interactive Buttons & Link Integrity Audit (200 Buttons)
        run: node scratch/audit_all_buttons.js

      - name: Run Comprehensive Master Test Suite (308 Tests)
        run: node scratch/comprehensive_test.js

      - name: Run 45-Phase Master Certification Engine
        run: node scratch/master_45_phase_certification.js

      - name: Run 60-Frontier Runtime Execution Engine (Zero Placeholders)
        run: node scratch/master_60_frontier_verification.js

      - name: Run 45-Pillar Final Closure Certification
        run: node scratch/final_closure_certification.js

      - name: Verify Database Migrations & Edge Runtime Assets
        run: |
          echo ">>> Verifying 15 SQL database migrations..."
          count=$(ls -1 supabase/migrations/*.sql | wc -l)
          echo "Found $count SQL migrations."
          test $count -ge 14
          echo ">>> All production verification gates successfully passed."
