name: IINSHA AI-BOS Master Production CI

on:
  push:
    branches: [ main, master, gh-pages, staging/activation-v1, staging/activation-v1-fix2, 'staging/**', 'activation/**' ]
  pull_request:
    branches: [ main, master, staging/activation-v1, 'staging/**', 'activation/**' ]
  workflow_dispatch:

jobs:
  production-certification:
    name: Production Verification & Security Audit Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Verify JavaScript Code Base Integrity
        run: |
          node -c app.js
          node -c hero3d.js
          node -c scroll-engine.js
          node -c worker.js
          node -c universal_ai_copilot.js
          node -c src/whatsapp_concierge.js

      - name: Run Master 55-Track Regression Firewall
        run: npm test

      - name: Run Master Authoritative E2E Suite
        run: npm run e2e

      - name: Run Live Surface & Button Parity Scanner
        run: node scripts/live-surface-smoke.mjs

      - name: Run PR #7 Ordered Staging Verification Gate
        run: node scripts/verify-preview-deployment.mjs
        env:
          LIVE_URL: https://staging-activation-v1.inshatech.pages.dev
          EXPECTED_SHA: ${{ github.sha }}
