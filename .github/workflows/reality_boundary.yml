name: Production Reality Boundary

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  reality-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reality boundary gate
        run: node scripts/verify_reality_boundary.mjs
      - name: Truth-gated system claims
        run: node scripts/verify_all_system_claims.mjs
