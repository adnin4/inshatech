name: P0 Security & Content Hardening Gate

on:
  push:
    branches: [ main, master, 'staging/**', 'activation/**' ]
  pull_request:
    branches: [ main, master, 'staging/**', 'activation/**' ]
  workflow_dispatch:

jobs:
  security-content-gate:
    name: Zero-Trust P0 Security & Content Leak Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Run P0 Security & Content Gate Scanner
        run: node scratch/security_content_gate.js
